# =============================================================================
# Regioner for agrometeorologisk risikodashboard
# Sist oppdatert: 2026-03-10
#
# AEMET-stasjonskoder (bekreftet aktive, kilde: AEMET OpenData / x-y.es):
#   Murcia-regionen:
#     7209     – Lorca              (312m, Guadalentín-dalen,  oppdatert daglig)
#     7026X    – Torre-Pacheco CCA (50m,  Campo de Cartagena,  oppdatert daglig)
#   Valencia-by:
#     8416Y    – Valencia Viveros  (11m,  bykjerne,            oppdatert daglig)
#     8414A    – Valencia Aeropuerto (56m, synoptisk stasjon,  timesdata)
#   Castellón:
#     8500A    – Castelló/Almassora (43m, synoptisk stasjon,   timesdata)
#   Valencia syd:
#     8058X    – Oliva              (1m,  kyst, historikk 1992–d.d.)
#     8300X    – Carcaixent         (25m, innland, sitrus-sone)
#   Huelva:
#     4642E    – Huelva
#   Sevilla:
#     5783     – Sevilla/San Pablo
#   Almería:
#     6325O    – Almería/Aeropuerto
#
# Merk: aemet_station brukes kun for live-kjøringer.
#        Historisk modus faller alltid tilbake på Open-Meteo arkiv.
# =============================================================================

