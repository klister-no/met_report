# =============================================================================
# Terskelverdier for risikoklassifisering
# Brukes av analyzer_new.py
# =============================================================================
thresholds:
  temp_high_warning:  35.0   # Varmerisiko (dag)
  temp_low_warning:    2.0   # Frostrisiko (natt)
  precip_excess_pct:  80.0   # Nedbørsoverskudd: +80% over normalen
  precip_deficit_pct: -40.0  # Nedbørsunderskudd: -40% under normalen
  wind_high_ms:       20.0   # Vindkast-risiko høy: >20 m/s
  wind_moderate_ms:   15.0   # Vindkast-risiko moderat: >15 m/s
