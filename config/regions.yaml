  # ── SPANIA – MURCIA (oppdatert 2026-03-10) ──────────────────────────────────
  # Endring: splitter gammel ES_MURCIA (Murcia by, 7178I) i to presise regioner.
  # Murcia by er ikke landbruksrelevant – Lorca og Campo de Cartagena er det.

  - id: ES_MURCIA_LORCA
    name: "ES – Murcia: Lorca/Guadalentín"
    country: Spain
    aemet_station: "7209"          # Lorca, 312m, aktiv, historikk fra 1984
    lat: 37.67
    lon: -1.69
    key_crops: [sitroner, grønnsaker, paprika, tomater, blomster]
    notes: >
      Guadalentín-dalen vest i Murcia. Primær produksjonssone for sitrus og grønnsaker.
      312m over havet – noe kaldere netter enn kysten. Frostrisiko jan–feb.
      AEMET 7209 dekker hele dalen inkl. Puerto Lumbreras-korridoren.
    normals:
      temp_day:   [13, 15, 18, 22, 26, 31, 35, 35, 29, 23, 17, 13]
      temp_night: [ 4,  5,  7, 10, 14, 18, 21, 21, 17, 12,  7,  4]
      precip_mm:  [22, 20, 25, 28, 25, 12,  4,  6, 22, 42, 35, 25]

  - id: ES_MURCIA_CAMPO
    name: "ES – Murcia: Campo de Cartagena"
    country: Spain
    aemet_station: "7026X"         # Torre-Pacheco CCA, 50m, aktiv, timesdata
    lat: 37.74
    lon: -0.97
    key_crops: [salat, brokkoli, blomkål, tomater, sitrus, blomster]
    notes: >
      Campo de Cartagena – flatland øst i Murcia mot Middelhavet.
      50m over havet, varmere netter enn innlandet. Tett irrigert grønnsaksone.
      Torre-Pacheco og Fuente Álamo er kjerneområdene. AEMET 7026X er primærstasjon.
      Sekundær referanse: 7023X Fuente Álamo (140m, 10km vest).
    normals:
      temp_day:   [15, 17, 19, 23, 27, 31, 33, 33, 29, 24, 19, 15]
      temp_night: [ 6,  7,  9, 12, 16, 20, 23, 23, 19, 14,  9,  6]
      precip_mm:  [25, 22, 28, 30, 25, 10,  3,  5, 22, 40, 32, 24]

  # ── SPANIA – VALENCIA (ny oppdeling 2026-03-10) ──────────────────────────────
  # Erstatter en tenkt generisk Valencia-region med tre presise soner som har
  # ulike værmønstre og produktprofiler.

  - id: ES_VALENCIA_NORTE
    name: "ES – Valencia: By og nord"
    country: Spain
    aemet_station: "8416Y"         # Valencia Viveros, 11m, bykjerne, daglig
    lat: 39.48
    lon: -0.37
    key_crops: [sitrus, tomater, paprika, blomster]
    notes: >
      Valencia by og Horta Nord (Sagunto–Valencia). Kystklima, sjelden frost.
      8416Y (Valencia Viveros) er primærstasjonen for temperaturer.
      8414A (Valencia Aeropuerto, 56m) brukes som backup og for vinddata.
      Inkluderer Sagunto-/Pobla de Vallbona-sonen nordover.
    normals:
      temp_day:   [15, 16, 19, 21, 25, 29, 32, 32, 28, 23, 18, 15]
      temp_night: [ 7,  8,  9, 12, 15, 19, 22, 22, 19, 15, 10,  7]
      precip_mm:  [35, 30, 35, 38, 42, 22, 10, 15, 58, 75, 55, 40]

  - id: ES_CASTELLON
    name: "ES – Castellón"
    country: Spain
    aemet_station: "8500A"         # Castelló/Almassora, 43m, synoptisk, timesdata
    lat: 39.99
    lon: -0.05
    key_crops: [appelsiner, klementiner, artisjokker, blomster]
    notes: >
      Castellón-provinsen (La Plana). Primær appelsin- og klementinsone i Spania.
      43m over havet, kystklima men noe kaldere enn Valencia om vinteren.
      8500A (Almassora) er eneste robuste synoptiske stasjon i provinsen.
      Inkluderer Nules-, Burriana- og Villarreal-sonene.
    normals:
      temp_day:   [14, 15, 18, 21, 24, 28, 31, 31, 27, 22, 17, 14]
      temp_night: [ 6,  7,  8, 11, 14, 18, 21, 21, 18, 14,  9,  6]
      precip_mm:  [40, 35, 40, 42, 50, 28, 12, 18, 65, 80, 60, 45]

  - id: ES_VALENCIA_SUR
    name: "ES – Valencia: Syd (Gandia–Oliva)"
    country: Spain
    aemet_station: "8058X"         # Oliva, 1m, kyst, historikk 1992–d.d.
    lat: 38.92
    lon: -0.12
    key_crops: [appelsiner, klementin, persimmon, druer, blomster]
    notes: >
      Sør-Valencia: La Safor og Ribera Alta/Baixa (Gandia, Oliva, Carcaixent-sonen).
      Varmere og fuktigere enn nord-Valencia, særlig om høsten (DANA-risiko sept–okt).
      8058X (Oliva, 1m) er primærstasjon – best for kyst og Safor-sonen.
      8300X (Carcaixent, 25m) er sekundær for innlandssonen (Ribera Alta).
      Viktig: Denne sonen ble hardt rammet av DANA-flommen oktober 2024.
    normals:
      temp_day:   [16, 17, 20, 22, 26, 30, 33, 33, 28, 23, 19, 16]
      temp_night: [ 7,  8, 10, 12, 16, 20, 23, 23, 19, 15, 10,  7]
      precip_mm:  [45, 38, 42, 45, 48, 25, 10, 18, 75, 95, 65, 48]

