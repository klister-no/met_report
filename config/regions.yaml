# ── RISK THRESHOLDS ──────────────────────────────────────────────────────────
risk_thresholds:
  temperature:
    low:      [-1.5, 1.5]    # deviation range for LOW risk
    moderate: [-3.0, 3.0]    # deviation range for MODERATE risk
    # outside moderate = HIGH risk

  precipitation:
    high_excess_pct: 150     # >150% above normal = HIGH risk
    moderate_excess_pct: 50  # 50–150% above normal = MODERATE risk
    high_deficit_pct: -40    # >40% below normal = MODERATE (drought) risk

  frost_threshold_c: 2       # night temp below this = frost risk flag

# ── STATUS INDICATORS ────────────────────────────────────────────────────────
status_indicators:
  warmer:  "🟢"   # >1.5°C above normal
  normal:  "🟡"   # within ±1.5°C
  cooler:  "🔵"   # >1.5°C below normal
